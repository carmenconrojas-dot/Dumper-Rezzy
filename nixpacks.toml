providers = ["python"]

[phases.setup]
nixPkgs = ["lua5_4"]
aptPkgs = ["python3", "python3-pip", "python3-dev"]

[phases.install]
cmds = ["pip3 install --break-system-packages -r requirements.txt"]

[phases.build]
cmds = ["echo 'Build phase skipped - deps installed in install phase'"]

[start]
cmd = "python3 bot.py"
